<body data-page="faq">

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">FAQ</span>
    <h1>자주 묻는 질문</h1>
    <p>여기에서 답을 찾지 못하셨다면 상담에서 편하게 물어보세요.</p>
  </div>
</section>

<section class="block" style="padding-top:20px">
  <div class="faq container">
    <!-- 질문을 추가하려면 아래 faq-item 블록을 복사하세요 -->
    <div class="faq-item">
      <button class="faq-q">상담은 어떻게 신청하나요?</button>
      <div class="faq-a">임시 답변입니다. 전화, 이메일, 홈페이지 상담신청 중 편한 방법으로 연락 주세요.</div>
    </div>
    <div class="faq-item">
      <button class="faq-q">지방에 있어도 세무기장이 가능한가요?</button>
      <div class="faq-a">임시 답변입니다. 비대면 상담과 서류 전달로 전국 어디서든 가능합니다.</div>
    </div>
    <div class="faq-item">
      <button class="faq-q">상담 비용이 있나요?</button>
      <div class="faq-a">임시 답변입니다. 문의 주시면 미리 안내드립니다.</div>
    </div>
    <div class="faq-item">
      <button class="faq-q">상담할 때 무엇을 준비하면 되나요?</button>
      <div class="faq-a">임시 답변입니다. 최근 신고서나 대략의 매출 규모를 알려주시면 더 구체적으로 안내드립니다.</div>
    </div>
    <div class="faq-item">
      <button class="faq-q">사무실 방문 상담도 가능한가요?</button>
      <div class="faq-a">임시 답변입니다. 미리 연락 주시면 시간을 맞춰 안내드립니다.</div>
    </div>
  </div>
</section>
