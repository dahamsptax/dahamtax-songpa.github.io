<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>상담문의 | 다함세무법인 송파지점</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <!-- 링크 공유 미리보기 (카카오톡·네이버 등): 도메인 연결 시 주소 변경 -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="다함세무법인 송파지점">
  <meta property="og:image" content="https://dahamsptax.github.io/dahamtax-songpa.github.io/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="css/style.css?v=15">
</head>
<body data-page="contact">

<section class="page-hero">
  <div class="container">
    <span class="eyebrow">CONTACT</span>
    <h1>상담 문의</h1>
    <p>문의만 남겨주시면 확인 후 연락드립니다.</p>
  </div>
</section>

<section class="block" style="padding-top:20px">
  <!--
    폼 전송 방식:
    - js/config.js 의 formEndpoint 가 있으면: 구글 시트 저장 + 슬랙 알림 (tools/contact-notify.gs)
    - 비어 있으면: 방문자의 메일 앱이 열리고 config.js 의 email 로 보냅니다.
  -->
  <div class="container">
  <form class="form" id="contact-form">
    <!-- 스팸 방지용 숨은 칸 (사람에게는 보이지 않음) -->
    <label class="hp" aria-hidden="true">웹사이트<input name="website" tabindex="-1" autocomplete="off"></label>
    <div class="row2">
      <label>성함 *<input name="name" required></label>
      <label>연락처 *<input name="phone" type="tel" required></label>
    </div>
    <label>이메일 (선택)<input name="email" type="email"></label>
    <div class="row2">
      <label>사업자 구분
        <select name="type"><option>개인사업자</option><option>법인</option><option>창업 예정</option><option>해당 없음</option></select>
      </label>
      <label>문의 서비스<select name="service"></select></label>
    </div>
    <label>문의 내용 *<textarea name="message" required></textarea></label>
    <label class="agree"><input type="checkbox" required> 개인정보 수집·이용에 동의합니다. (수집 항목: 성함·연락처·문의 내용 / 이용 목적: 상담 접수 및 회신 / 보유 기간: 상담 종료 후 1년)</label>
    <button class="btn btn-primary" type="submit">상담 문의 보내기</button>
    <p class="form-status" role="status" aria-live="polite"></p>
  </form>

  <!-- 빠른 문의: 전화·카카오톡 (내용은 js/config.js 의 phone·kakao·hours) -->
  <div class="quick-contact" id="quick-contact"></div>
  </div>
</section>

<section class="block soft">
  <div class="container info-grid">
    <div class="info-card">
      <span class="eyebrow">LOCATION</span>
      <h2 class="sec-title">오시는 길</h2>
      <dl>
        <dt>주소</dt><dd data-site="address"></dd>
        <dt>전화</dt><dd data-site="phone"></dd>
        <dt>휴대폰</dt><dd data-site="mobile"></dd>
        <dt>이메일</dt><dd data-site="email"></dd>
        <dt>시간</dt><dd data-site="hours"></dd>
      </dl>
    </div>
    <!-- 지도: images/map.png (네이버 지도 캡처). 지도나 버튼을 누르면 js/config.js 의 mapLink(네이버 지도)로 이동 -->
    <a class="map-box map-wrap map-link" href="#" target="_blank" rel="noopener" aria-label="네이버 지도에서 길찾기">
      <img src="images/map.png?v=1" alt="다함세무법인 송파지점 오시는 길: 강동구청역에서 도보 약 8분">
      <span class="map-cta">네이버 지도에서 길찾기 →</span>
    </a>
  </div>
</section>

<script src="js/config.js?v=13"></script>
<script src="js/main.js?v=13"></script>
</body>
</html>
